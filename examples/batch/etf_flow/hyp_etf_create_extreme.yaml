id: hyp_etf_create_extreme
version: 1
asset: BTC/USDT
timeframe: 1d
taxonomy: other
family_id: family_etf_flow_ineff_v1
direction: long_only
entry:
  expression: flow_inflow_extreme == 1 and above_sma_50 == 1
exit:
  expression: flow_inflow_extreme == 0 or above_sma_50 == 0
rationale: >
  Large creation days (expanding 80th percentile of lagged net flow) are more
  likely to leave residual demand/impact than routine small prints. Long only
  on extreme + mild trend; flat otherwise. Same family budget as all ETF-flow
  hyps. Programme: docs/PROGRAMME_ETF_FLOW_INEFF_V1.md.
expected_outcome: Exploratory; confirmatory only if sole best val survivor.
feature_tags:
  - etf_flow
  - flow_pit_v1
  - true_flow
literature_refs: []
falsification:
  min_trades: 30
  reject_if: driven by few extreme days only (winsorize check)
